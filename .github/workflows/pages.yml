name: Build data, test and deploy CargoNav

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore rolling UEX history cache
        uses: actions/cache@v4
        with:
          path: public/data/trade-history.json
          key: ${{ runner.os }}-uex-history-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-uex-history-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Refresh UEX + SC Trade Tools snapshot
        run: npm run build:data
        env:
          UEX_API_BASE: 'https://api.uexcorp.uk/2.0'
          SCTRADE_CROWD_MAX_PAGES: '20'
          UEX_DISTANCE_PAIRS: '80'
      - name: Refresh rolling UEX price history cache
        run: npm run build:history
        env:
          UEX_API_BASE: 'https://api.uexcorp.uk/2.0'
          UEX_HISTORY_PAIRS: '30'
          UEX_HISTORY_POINTS: '90'
          UEX_HISTORY_REFRESH_HOURS: '48'
          UEX_HISTORY_CACHE_PAIRS: '1000'
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
