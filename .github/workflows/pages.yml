name: Build data, test and deploy CargoNav

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore rolling UEX history cache
        uses: actions/cache@v4
        with:
          path: public/data/trade-history.json
          key: ${{ runner.os }}-uex-history-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-uex-history-
      - name: Restore StarCitizenWiki ship quantum cache
        uses: actions/cache@v4
        with:
          path: public/data/ship-quantum.json
          key: ${{ runner.os }}-ship-quantum-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ship-quantum-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Refresh UEX + SC Trade Tools snapshot
        run: npm run build:data
        env:
          UEX_API_BASE: 'https://api.uexcorp.uk/2.0'
          SCTRADE_CROWD_MAX_PAGES: '20'
          UEX_DISTANCE_PAIRS: '55'
          SCWIKI_API_BASE: 'https://api.star-citizen.wiki/api'
          SCWIKI_QUANTUM_MAX_FETCHES: '180'
          SCWIKI_QUANTUM_REFRESH_HOURS: '24'
          SCWIKI_QUANTUM_CONCURRENCY: '6'
      - name: Build current LIVE gateway topology
        run: node scripts/build-topology.mjs
        env:
          SCWIKI_API_BASE: 'https://api.star-citizen.wiki/api'
      - name: Refresh rolling UEX price history cache
        run: npm run build:history
        env:
          UEX_API_BASE: 'https://api.uexcorp.uk/2.0'
          UEX_HISTORY_PAIRS: '30'
          UEX_HISTORY_POINTS: '90'
          UEX_HISTORY_REFRESH_HOURS: '48'
          UEX_HISTORY_CACHE_PAIRS: '1000'
      - run: npm test
      - run: npm run typecheck
      - name: Record successful data refresh
        run: |
          node -e "const fs=require('node:fs');fs.mkdirSync('public/data',{recursive:true});fs.writeFileSync('public/data/refresh-status.json',JSON.stringify({updatedAt:new Date().toISOString(),source:'github-actions'},null,2))"
      - run: npm run build
      - name: Maintain repository activity for scheduled refreshes
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          last=$(cat .github/last-scheduled-refresh.txt 2>/dev/null || echo 0)
          if ! [[ "$last" =~ ^[0-9]+$ ]]; then last=0; fi
          if (( now - last >= 7 * 24 * 60 * 60 )); then
            echo "$now" > .github/last-scheduled-refresh.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/last-scheduled-refresh.txt
            git commit -m "chore: record successful scheduled refresh [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
