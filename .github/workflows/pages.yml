name: Build and deploy GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # SC Trade Tools crowdsource endpoint is cached server-side for about 1 hour.
    - cron: "0 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build route data from SC Trade Tools only
        run: npm run build:data
        env:
          # Optional: required only for token-protected Swagger endpoints such as POST /api/tools/trades.
          # Without it, the project still builds from public GET /api/crowdsource/commodity-listings.
          SCTRADE_TOKEN: ${{ secrets.SCTRADE_TOKEN || '' }}
          SCTRADE_BASE: ${{ vars.SCTRADE_BASE || 'https://sc-trade.tools' }}

          # Main build params.
          SHIP_SCU: ${{ vars.SHIP_SCU || '128' }}
          INVESTMENT_AUEC: ${{ vars.INVESTMENT_AUEC || '1000000' }}
          TOP_N: ${{ vars.TOP_N || '300' }}
          MIN_INVENTORY_SCU: ${{ vars.MIN_INVENTORY_SCU || '1' }}
          MAX_ROUTE_ROI_PCT: ${{ vars.MAX_ROUTE_ROI_PCT || '300' }}
          MAX_SELL_BUY_RATIO: ${{ vars.MAX_SELL_BUY_RATIO || '4' }}
          MAX_PROFIT_PER_SCU: ${{ vars.MAX_PROFIT_PER_SCU || '0' }}
          ALLOW_EMPTY_ROUTES: ${{ vars.ALLOW_EMPTY_ROUTES || 'false' }}

          # SC Trade Tools Swagger API settings.
          SCTRADE_USE_TOOL_ROUTES: ${{ vars.SCTRADE_USE_TOOL_ROUTES || 'true' }}
          SCTRADE_SHIP: ${{ vars.SCTRADE_SHIP || 'Freelancer' }}
          SCTRADE_PROFIT_TYPE: ${{ vars.SCTRADE_PROFIT_TYPE || 'time' }}
          SCTRADE_MAX_STOPS: ${{ vars.SCTRADE_MAX_STOPS || '1' }}
          SCTRADE_SUPPORTED_BOX_SIZE_SCU: ${{ vars.SCTRADE_SUPPORTED_BOX_SIZE_SCU || '32' }}
          SCTRADE_MIN_SECURITY_LEVEL: ${{ vars.SCTRADE_MIN_SECURITY_LEVEL || '0' }}
          SCTRADE_AVOID_HIDDEN_LOCATIONS: ${{ vars.SCTRADE_AVOID_HIDDEN_LOCATIONS || 'true' }}
          SCTRADE_ALLOW_WAIT_TIMES: ${{ vars.SCTRADE_ALLOW_WAIT_TIMES || 'false' }}
          SCTRADE_USE_AUTO_LOADING: ${{ vars.SCTRADE_USE_AUTO_LOADING || 'false' }}
          SCTRADE_SMART_FILTERS: ${{ vars.SCTRADE_SMART_FILTERS || 'true' }}
          SCTRADE_ORIGIN: ${{ vars.SCTRADE_ORIGIN || '' }}
          SCTRADE_LOCATION_NAMES: ${{ vars.SCTRADE_LOCATION_NAMES || '' }}
          SCTRADE_LOCATION_NAMES_TYPE: ${{ vars.SCTRADE_LOCATION_NAMES_TYPE || 'blacklist' }}
          SCTRADE_LOCATION_TYPES: ${{ vars.SCTRADE_LOCATION_TYPES || '' }}
          SCTRADE_LOCATION_TYPES_TYPE: ${{ vars.SCTRADE_LOCATION_TYPES_TYPE || 'blacklist' }}
          SCTRADE_FACTION_NAMES: ${{ vars.SCTRADE_FACTION_NAMES || '' }}
          SCTRADE_FACTION_NAMES_TYPE: ${{ vars.SCTRADE_FACTION_NAMES_TYPE || 'blacklist' }}
          SCTRADE_COMMODITY_NAMES: ${{ vars.SCTRADE_COMMODITY_NAMES || '' }}
          SCTRADE_COMMODITY_NAMES_TYPE: ${{ vars.SCTRADE_COMMODITY_NAMES_TYPE || 'blacklist' }}
          SCTRADE_COMMODITY_TYPES: ${{ vars.SCTRADE_COMMODITY_TYPES || '' }}
          SCTRADE_COMMODITY_TYPES_TYPE: ${{ vars.SCTRADE_COMMODITY_TYPES_TYPE || 'blacklist' }}

          # Public SC Trade Tools crowdsource listings, no token required.
          SCTRADE_USE_CROWDSOURCE: ${{ vars.SCTRADE_USE_CROWDSOURCE || 'true' }}
          SCTRADE_CROWD_MAX_PAGES: ${{ vars.SCTRADE_CROWD_MAX_PAGES || '20' }}
          SCTRADE_CROWD_MAX_AGE_DAYS: ${{ vars.SCTRADE_CROWD_MAX_AGE_DAYS || '21' }}
          SCTRADE_CROWD_MIN_QUANTITY_SCU: ${{ vars.SCTRADE_CROWD_MIN_QUANTITY_SCU || '1' }}
          SCTRADE_CROWD_REQUIRE_BOX_COMPAT: ${{ vars.SCTRADE_CROWD_REQUIRE_BOX_COMPAT || 'false' }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
