name: Build data, test and deploy CargoNav

on:
  push:
    branches: [main]
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cargonav-deploy-recovery-20261121
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore rolling UEX history cache
        uses: actions/cache@v4
        with:
          path: public/data/trade-history.json
          key: ${{ runner.os }}-uex-history-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-uex-history-
      - name: Restore StarCitizenWiki ship quantum cache
        uses: actions/cache@v4
        with:
          path: public/data/ship-quantum.json
          key: ${{ runner.os }}-ship-quantum-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ship-quantum-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Refresh UEX + SC Trade Tools snapshot
        run: npm run build:data
        env:
          UEX_API_BASE: 'https://api.uexcorp.uk/2.0'
          SCTRADE_CROWD_MAX_PAGES: '20'
          UEX_DISTANCE_PAIRS: '55'
          SCWIKI_API_BASE: 'https://api.star-citizen.wiki/api'
          SCWIKI_QUANTUM_MAX_FETCHES: '180'
          SCWIKI_QUANTUM_REFRESH_HOURS: '24'
          SCWIKI_QUANTUM_CONCURRENCY: '6'
      - name: Build current LIVE gateway topology
        run: node scripts/build-topology.mjs
        env:
          SCWIKI_API_BASE: 'https://api.star-citizen.wiki/api'
      - name: Refresh rolling UEX price history cache
        run: npm run build:history
        env:
          UEX_API_BASE: 'https://api.uexcorp.uk/2.0'
          UEX_HISTORY_PAIRS: '30'
          UEX_HISTORY_POINTS: '90'
          UEX_HISTORY_REFRESH_HOURS: '48'
          UEX_HISTORY_CACHE_PAIRS: '1000'
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  cleanup-pages-deployments:
    name: Retire older Pages deployments
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Retire previous Pages deployments
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner, repo, environment: 'github-pages', per_page: 100
            });
            const newest = deployments.reduce((best, item) =>
              !best || item.id > best.id ? item : best, null);
            if (!newest) {
              core.warning('No github-pages deployments found; cleanup skipped.');
              return;
            }
            const getStatus = async (deployment_id) => {
              const { data } = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id, per_page: 1
              });
              return data[0]?.state ?? 'unknown';
            };
            const newestState = await getStatus(newest.id);
            if (newest.sha !== context.sha || newestState !== 'success') {
              core.warning('Newest Pages deployment not confirmed: id=' + newest.id + ', state=' + newestState + ', sha=' + newest.sha + ', workflowSha=' + context.sha + '. Cleanup skipped.');
              return;
            }
            // Never touch the latest successful deployment or any newer deployment.
            const previous = deployments
              .filter(item => item.id < newest.id)
              .sort((a, b) => b.id - a.id);
            let removed = 0;
            let skipped = 0;
            let failed = 0;
            // Process older records in batches to avoid GitHub API rate limits.
            for (const old of previous.slice(0, 40)) {
              try {
                const state = await getStatus(old.id);
                if (['queued', 'pending', 'in_progress'].includes(state)) {
                  core.warning('Skipping deployment ' + old.id + ' (' + state + ').');
                  skipped++;
                  continue;
                }
                if (state !== 'inactive') {
                  await github.rest.repos.createDeploymentStatus({
                    owner, repo, deployment_id: old.id, state: 'inactive',
                    auto_inactive: false,
                    description: 'Superseded by successful GitHub Pages deployment ' + newest.id
                  });
                }
                await github.rest.repos.deleteDeployment({
                  owner, repo, deployment_id: old.id
                });
                removed++;
              } catch (error) {
                failed++;
                core.warning('Could not retire deployment ' + old.id + ': ' + error.message);
              }
            }
            core.info('Pages deployment cleanup: current=' + newest.id +
              ', removed=' + removed + ', skipped=' + skipped +
              ', errors=' + failed + ', remaining=' +
              Math.max(0, previous.length - removed) + '.');
            if (failed > 0) {
              core.warning('Some old deployments remain; next successful publish will retry.');
            }
