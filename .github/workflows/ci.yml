name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and refresh lockfile
        run: npm install --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
      - name: Verify live data aggregation
        run: npm run build:data
        env:
          UEX_API_BASE: 'https://api.uexcorp.uk/2.0'
          SCTRADE_CROWD_MAX_PAGES: '2'
          UEX_DISTANCE_PAIRS: '5'
          SCWIKI_API_BASE: 'https://api.star-citizen.wiki/api'
          SCWIKI_QUANTUM_MAX_FETCHES: '12'
          SCWIKI_QUANTUM_REFRESH_HOURS: '24'
          SCWIKI_QUANTUM_CONCURRENCY: '4'
      - name: Verify current LIVE gateway topology
        run: node scripts/build-topology.mjs
        env:
          SCWIKI_API_BASE: 'https://api.star-citizen.wiki/api'
          SCWIKI_TOPOLOGY_STRICT: '1'
      - name: Verify UEX history aggregation
        run: |
          npm run build:history
          node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync('public/data/trade-history.json'));if(!Object.keys(x.series||{}).length)process.exit(1)"
        env:
          UEX_API_BASE: 'https://api.uexcorp.uk/2.0'
          UEX_HISTORY_PAIRS: '3'
          UEX_HISTORY_REFRESH_HOURS: '1'
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
