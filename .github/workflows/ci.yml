name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify live data aggregation
        run: npm run build:data
        env:
          UEX_API_BASE: 'https://api.uexcorp.uk/2.0'
          SCTRADE_CROWD_MAX_PAGES: '2'
          UEX_DISTANCE_PAIRS: '5'
      - run: npm test
      - run: npm run build
